name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: TypeScript check
        run: npm run check
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Go tests
        run: go test ./...
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Windows desktop build
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) 'bin/wails.exe'
          & $wails build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
