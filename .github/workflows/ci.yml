name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: TypeScript check
        run: npm run check
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Build CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/bin -Force | Out-Null
          go build -o build/bin/net-evidence-cli.exe ./cmd/net-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Windows desktop build
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) 'bin/wails.exe'
          & $wails build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build user-scope installer
        shell: pwsh
        run: |
          $nsisPaths = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe',
            'C:\ProgramData\chocolatey\bin\makensis.exe'
          )
          $nsis = $nsisPaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS makensis.exe was not found on the Windows runner.' }
          $env:PATH = "$(Split-Path -Parent $nsis);$env:PATH"
          $wails = Join-Path (go env GOPATH) 'bin/wails.exe'
          & $wails build -nsis -installscope user
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test installer and uninstaller
        shell: pwsh
        run: ./scripts/verify-installer.ps1
